<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASMILE-BO Front Office Hub Reference</title>
<style>
:root{
  --bg1:#f8fbff;--bg2:#eaf3ff;--ink:#123261;--muted:#5d7390;
  --card:#ffffffee;--border:#dbe7f6;--shadow:0 12px 30px rgba(42,82,135,.12)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink)}
body{
  background:
   radial-gradient(circle at 4% 4%,rgba(106,167,255,.18),transparent 26%),
   radial-gradient(circle at 96% 94%,rgba(106,167,255,.18),transparent 28%),
   linear-gradient(135deg,var(--bg1),#fff 44%,var(--bg2));
}
main{min-height:100vh;padding:74px 34px 60px;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:76px}
h1{margin:0;font-size:64px;line-height:1.08;font-weight:700;color:#12366b}
header p{margin:18px 0 0;font-size:25px;color:var(--muted)}
.grid{width:100%;max-width:1240px;display:grid;grid-template-columns:repeat(4,1fr);gap:34px 28px}
.card{
  min-height:126px;padding:22px 28px;display:flex;align-items:center;gap:24px;
  color:inherit;text-decoration:none;background:var(--card);border:1px solid var(--border);
  border-radius:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:.18s ease;cursor:pointer
}
.card:after{content:"";position:absolute;left:13%;right:13%;bottom:-4px;height:8px;border-radius:99px;background:var(--accent);filter:blur(8px);opacity:.35}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 38px rgba(42,82,135,.17)}
.card:active{transform:translateY(-1px)}
.icon{width:74px;height:74px;flex:0 0 74px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,var(--soft),var(--accent));box-shadow:0 10px 22px color-mix(in srgb,var(--accent) 36%,transparent)}
.icon svg{width:42px;height:42px;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.label{font-size:26px;font-weight:600;white-space:nowrap;color:#10264e}
.center1{grid-column:1;margin-left:calc(50% + 14px)}
.center2{grid-column:2;margin-left:calc(50% + 14px)}
.center3{grid-column:3;margin-left:calc(50% + 14px)}
@media(max-width:1120px){.grid{grid-template-columns:repeat(3,1fr)}.center1,.center2,.center3{grid-column:auto;margin-left:0}}
@media(max-width:820px){main{padding:48px 22px}header{margin-bottom:48px}h1{font-size:44px}.grid{grid-template-columns:repeat(2,1fr);gap:22px}.card{min-height:112px;padding:18px 22px}.icon{width:64px;height:64px;flex-basis:64px}.label{font-size:20px;white-space:normal}}
@media(max-width:540px){.grid{grid-template-columns:1fr}h1{font-size:36px}header p{font-size:17px}}
</style>
</head>
<body>
<main>
<header>
  <h1>Quản lý khách sạn</h1>
  <p>Trung tâm điều hành các nghiệp vụ tiền sảnh và lưu trú</p>
</header>
<section class="grid">
  <a class="card" style="--accent:#1765f2;--soft:#4a8eff"><span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 9h18M7 13h.01M12 13h.01M17 13h.01M7 17h.01M12 17h.01M17 17h.01"/></svg></span><span class="label">Đặt phòng</span></a>
  <a class="card" style="--accent:#00a58f;--soft:#31c9b8"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span class="label">Lễ tân</span></a>
  <a class="card" style="--accent:#ed7900;--soft:#ffad39"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3 7h15a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7z"/><path d="M3 7l14-4v4M16 13h5"/></svg></span><span class="label">Thu ngân</span></a>
  <a class="card" style="--accent:#7d2be1;--soft:#b158ff"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="3"/><path d="M3 20a6 6 0 0 1 12 0M13 20a5 5 0 0 1 8 0"/></svg></span><span class="label">Đoàn</span></a>

  <a class="card" style="--accent:#18b33f;--soft:#4ed86e"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v11h14V10M9 21v-6h6v6"/></svg></span><span class="label">Nhà buồng</span></a>
  <a class="card" style="--accent:#1e6cf1;--soft:#4a91ff"><span class="icon"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7A2 2 0 0 1 22 16.9z"/></svg></span><span class="label">Tổng đài</span></a>
  <a class="card" style="--accent:#00a7ba;--soft:#2cc7d8"><span class="icon"><svg viewBox="0 0 24 24"><path d="M6 2h9l3 3v17H6z"/><path d="M14 2v5h5M12 9v8M9.5 11h4a2 2 0 1 1 0 4h-3a2 2 0 1 0 0 4h4"/></svg></span><span class="label">Kế toán phải thu</span></a>
  <a class="card" style="--accent:#195fce;--soft:#3e83f3"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span><span class="label">Truy vấn thông tin</span></a>

  <a class="card center1" style="--accent:#e32f70;--soft:#ff5a94"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3 11v2a2 2 0 0 0 2 2h2l3 5h3l-2-5 8-3V6l-8 3H5a2 2 0 0 0-2 2z"/></svg></span><span class="label">Marketing</span></a>
  <a class="card center2" style="--accent:#6f28d8;--soft:#9853f0"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20V8"/><path d="M3 8l6-4 6 4 6-5"/></svg></span><span class="label">Báo cáo</span></a>
  <a class="card center3" style="--accent:#1046b7;--soft:#2661d9"><span class="icon"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/><path d="M17 3v3M15.5 4.5h3M19 8v2M18 9h2"/></svg></span><span class="label">Night Audit</span></a>
</section>
</main>
</body>
</html>
